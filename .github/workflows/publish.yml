name: Publish MyGet

on:
  push:
    tags: [ '**' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Pack
        run: dotnet pack src/Carter.Cache/Carter.Cache.csproj --configuration Release -o "$NUPKGS" --include-symbols
      - name: Pack Memcached
        run: dotnet pack src/Carter.Cache.Memcached/Carter.Cache.Memcached.csproj --configuration Release -o "$NUPKGS" --include-symbols
      - name: Pack Redis
        run: dotnet pack src/Carter.Cache.Redis/Carter.Cache.Redis.csproj --configuration Release -o "$NUPKGS" --include-symbols
      - name: Publish MyGet
        env:
          MYGET_KEY: ${{ secrets.MYGET_KEY }}
        run: dotnet nuget push "$NUPKGS/*.nupkg" --skip-duplicate --source "$MYGET_FEED" --api-key "$MYGET_KEY"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  MYGET_FEED: https://www.myget.org/F/carter-cache/api/v3/index.json
  NUPKGS: ./.nupkgs
